# PlayerTools 配置文件
# 消息等配置执行重载指令即可生效
# 根指令可在游戏内用 "<根指令> root set <名称>" 修改

command:
  # 根指令名称，例如 hc 则使用 /hc
  name: playertools
  # 根指令别名（可留空）
  aliases:
    - ptool

# 自定义子指令放在 plugins/PlayerTools/commands/<名称>/command.yml
# 可用 "<根指令> create <名称> [描述]" 在游戏内自动生成模板

messages:
  prefix: "&8[&bPlayerTools&8] &r"
  no-permission: "&c你没有权限执行此操作。"
  unknown-subcommand: "&c未知子指令 &e%sub%&c，使用 &e/%root% help &c查看帮助。"
  player-only: "&c该指令只能由玩家执行。"
  reload-success: "&a配置已重新加载，根指令：&e/%root%"
  help-header: "&8&m--------&r &bPlayerTools 帮助 &8&m--------"
  help-entry: "&e/%root% %usage% &7- &f%description%"
  help-footer: "&8&m--------------------------------"
  invalid-name: "&c名称只能包含小写字母、数字、下划线或短横线，长度 1-32。"
  root-current: "&7当前根指令：&e/%root%"
  root-usage: "&c用法：&e/%root% root set <名称>"
  root-same: "&7根指令已经是 &e/%name%&7。"
  root-changed: "&a根指令已切换为 &e/%name%&a。"
  root-changed-restart: "&a根指令已保存为 &e/%name%&a，重启服务器后生效。"
  create-usage: "&c用法：&e/%root% create <名称> [描述]"
  create-exists: "&c子指令 &e%name% &c已存在。"
  create-success: "&a已创建子指令 &e%name%&a，配置文件：&f%path%"
  custom-no-help: "&7该子指令还没有配置帮助内容。"
  custom-no-info: "&7该子指令还没有配置信息内容。"
